syntax = "proto3";
package msg_factory;

message factory_eff_compose {
  int64 effType = 1;
  int64 effValue = 2;
}

message factory_info {
  int64 fid = 1;
  int64 lv = 2;
  int64 employeeAmount = 3;
  // partnerId: unknown field number
  int64 eff = 5;
  // effCompose: unknown field number
  int64 recruitReduceCost = 7;
  int64 lvMax = 8;
}

message C2S_ROLE_FACTORY {}

message S2C_ROLE_FACTORY {
  // factoryInfos: unknown field number
  int64 totalEff = 2;
}

message C2S_GET_FACTORY_OFFLINE {
  int64 lastExitTime = 1;
}

message S2C_GET_FACTORY_OFFLINE {
  int64 offlineTime = 1;
  int64 eff = 2;
}

message C2S_UNLOCK_FACTORY {
  int64 fid = 1;
}

message S2C_UNLOCK_FACTORY {}

message C2S_UPGRADE_FACTORY {
  int64 fid = 1;
}

message S2C_UPGRADE_FACTORY {}

message C2S_CLICK_BANK {
