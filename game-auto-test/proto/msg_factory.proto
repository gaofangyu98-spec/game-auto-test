}

message Patient {
  int64 id = 1;
  int64 degreeId = 2;
  // costItem: unknown field number
  int64 bDiagnose = 4;
}

message NewBieGuild {
  int64 lvl = 1;
  int64 exp = 2;
  int64 totalExp = 3;
  int64 totalPatients = 4;
  int64 healing = 5;
  int64 giveCaseHealing = 6;
  int64 caseGroup = 7;
  // patients: unknown field number
  // medicineIds: unknown field number
  // medicalBook: unknown field number
  // tasks: unknown field number
  int64 taskBeginTime = 12;
  // caseId: unknown field number
