syntax = "proto3";
package msg_jigsaw_puzzle;

message C2S_JIGSAW_PUZZLE_LOAD_INFO {
  int64 id = 1;
}

message S2C_JIGSAW_PUZZLE_LOAD_INFO {
  // points: unknown field number
  // takedRewards: unknown field number
}

message C2S_JIGSAW_PUZZLE_DRAW {
  int64 id = 1;
}

message S2C_JIGSAW_PUZZLE_DRAW {
  int64 point = 1;
}

message C2S_JIGSAW_PUZZLE_TAKE_REWARD {
  int64 id = 1;
  int64 actId = 2;
}

message S2C_JIGSAW_PUZZLE_TAKE_REWARD {
  int64 id = 1;
  int64 isReload = 2;
}
