syntax = "proto3";
package msg_ai_activity;
import "msg_common.proto";
import "enum_const.proto";
option go_package = "./../../pb";

message ai_activity_base {
    int32 id          = 1;  // 冲榜id
    int32 sub_type    = 2;  // 活动子类型，比如冲榜类活动，子类型就是冲榜类型
    int64 start_time  = 3;  // 开始时间,毫秒
    int64 end_time    = 4;  // 结束时间,毫秒
    int64 reward_time = 5;  // 奖励开始领取时间,毫秒
    int64 idx = 6;          // 自增 id，用于前端排序
}

message ai_activity_rank {
    ai_activity_base base_info                      = 1;  // 排行榜基础配置信息
    repeated msg_common.ai_activity_rank_info ranks = 3;  // 排行榜列表
    int64 mine_score                                = 4;  // 我的得分
    int32 mine_rank                                 = 5;  // 我的排名
    bool gift_taked                                 = 6;  // 奖励是否已领取
    int64 init_score                                = 7;  // 初始得分
    bool day_reward_taked                           = 8;  // 每日奖励是否已领取
}

// 活动总列表
message C2S_AI_ACTIVITY_LIST {
}

message S2C_AI_ACTIVITY_LIST {
    repeated ai_activity_base ai_activity_rank_list             = 1;   // 冲榜列表
    repeated ai_activity_base ai_activity_limit_recharge_list   = 2;   // 限时充值列表
    repeated ai_activity_base ai_activity_limit_gift_list       = 3;   // 限时礼包列表
    repeated ai_activity_base ai_activity_turntable_list        = 4;   // 转盘列表
    repeated ai_activity_base ai_activity_turntable_dia_list    = 5;   // 钻石转盘列表
    repeated ai_activity_base ai_activity_battlepass_list       = 6;   // 战令列表
    repeated ai_activity_base ai_activity_battlepass_two_list   = 7;   // 节日战令列表
    repeated ai_activity_base ai_activity_fund_list             = 8;   // 基金列表
    repeated ai_activity_base ai_activity_daypass_list          = 9;   // 天数通行证列表
    repeated ai_activity_base ai_activity_sign7day_list         = 10;  // 七日签到列表
    repeated ai_activity_base ai_activity_recharge_double_list  = 11;  // 充值双倍列表
    repeated ai_activity_base ai_activity_lucky_cat_list        = 12;  // 招财猫列表
    repeated ai_activity_base ai_activity_limit_gift_cross_list = 13;  // 跨服特惠礼包列表
    repeated ai_activity_base ai_activity_rank_cross_list       = 14;  // 跨服冲榜列表
    repeated ai_activity_base ai_activity_snake_gift_list       = 15;  // 蛇形礼包列表
    repeated ai_activity_base ai_activity_lucky_chess_list      = 16;  // 幸运棋牌列表
    repeated ai_activity_base ai_activity_lucky_bag_list        = 17;  // 幸运福袋列表
    repeated ai_activity_base aiActivityPyramidList             = 18;  // 金字塔
    repeated ai_activity_base aiActivityHolidayList             = 19;  // 节日活动列表
    repeated ai_activity_base aiActivityMinigameList            = 20; // 小游戏活动列表
    repeated ai_activity_base ai_activity_tongle_gift_list    = 21;  // 同乐礼包列表
    repeated ai_activity_base aiActivityRushGiftList            = 22;  // 冲榜礼包列表
}

// 活动内容变化时同步
message S2C_AI_ACTIVITY_SYNC {
}

// 冲榜获取信息
message C2S_AI_ACTIVITY_RANK_GET_INFO {
    int32 id = 1;  // 活动id
}

message S2C_AI_ACTIVITY_RANK_GET_INFO {
    ai_activity_rank ai_activity_rank_info = 1;  // 冲榜信息
}

// 冲榜领取奖励
message C2S_AI_ACTIVITY_RANK_TAKE_REWARD {
    int32 id = 1;  // 活动id
}

message S2C_AI_ACTIVITY_RANK_TAKE_REWARD {
    int32 id                                   = 1;  // 活动id
    enum_const.AI_ACTIVITY_RANK_TYPE rank_type = 2;  // 冲榜类型
    bool gift_taked                            = 3;  // 奖励是否已领取
}

// 冲榜领取每日奖励
message C2S_AI_ACTIVITY_RANK_TAKE_DAY_REWARD {
    int32 id = 1;  // 活动id
}

message S2C_AI_ACTIVITY_RANK_TAKE_DAY_REWARD {
    int32 id                                   = 1;  // 活动id
    enum_const.AI_ACTIVITY_RANK_TYPE rank_type = 2;  // 冲榜类型
    bool day_reward_taked                      = 3;  // 每日奖励是否已领取
}

message time_limit_recharge_info {
    int32 id     = 1;  // 配表Id
    int32 value  = 2;  // 值
    int32 status = 3;  // 状态
}

enum AI_ACTIVITY_LIMIT_RECHARGE_TYPE {
    NONE  = 0;  // 无
    DAY   = 1;  // 每日充值
    TOTAL = 2;  // 累计充值
    TASK  = 3;  // 任务奖励
}

message ai_activity_limit_recharge_reward_list {
    repeated int32 reward_indexs = 1;  // 充值奖励列表
}

// 请求活动数据
message C2S_AI_ACTIVITY_LIMIT_RECHARGE_INFO {
    int32 id = 1;  // 活动id
}
message S2C_AI_ACTIVITY_LIMIT_RECHARGE_INFO {
    map<int32, int32> amount_map                                        = 1;  // 充值金额
    map<int32, ai_activity_limit_recharge_reward_list> reward_index_map = 2;  // 已领取奖励的index
}

// 请求领取奖励
message C2S_AI_ACTIVITY_LIMIT_RECHARGE_GET_REWARD {
    int32 id                             = 1;  // 活动id
    int32 index                          = 2;  // 奖励index
    AI_ACTIVITY_LIMIT_RECHARGE_TYPE type = 3;  // 类型
}
message S2C_AI_ACTIVITY_LIMIT_RECHARGE_GET_REWARD {
}

// 特惠礼包，限购礼包
message C2S_AI_ACTIVITY_LIMIT_GIFT_INFO {
    int32 id = 1;  // 活动id
}
message S2C_AI_ACTIVITY_LIMIT_GIFT_INFO {
    bool day_free_reward_status = 1;  // 是否领取每日免费奖励
    map<int32, int32> buy_times = 2;  // 已经购买次数，key:index,value:次数
}

// 特惠礼包，限购礼包领取每日免费奖励
message C2S_AI_ACTIVITY_LIMIT_GIFT_TAKE_FREE_REWARD {
    int32 id = 1;  // 活动id
}
message S2C_AI_ACTIVITY_LIMIT_GIFT_TAKE_FREE_REWARD {
}
// 转盘信息
message C2S_AI_ACTIVITY_TURNTABLE_INFO {
    int32 id = 1;  // 活动id
}
message S2C_AI_ACTIVITY_TURNTABLE_INFO {
    map<int32, int32> infos                   = 1;  // k:格子index,v:剩余次数
    repeated msg_common.reward_record records = 2;  // 抽到大奖的记录
    int32 active_value                        = 3;  // 当前活跃值
    repeated int32 active_reward_indexs       = 4;  // 活跃已领奖index
}

// 转盘抽奖
message C2S_AI_ACTIVITY_TURNTABLE_DRAW {
    int32 id        = 1;  // 活动id
    int32 draw_type = 2;  // 抽奖类型 1 单次 2 一键
}
message S2C_AI_ACTIVITY_TURNTABLE_DRAW {
    map<int32, int32> infos                   = 1;  // k:格子index,v:剩余次数
    int32 active_value                        = 2;  // 当前活跃值
    repeated int32 hit_indexs                 = 3;  // 所有转到的格子
    repeated msg_common.reward_record records = 4;  // 抽到大奖的记录
}

// 转盘领取活跃奖励
message C2S_AI_ACTIVITY_TURNTABLE_ACTIVE_REWARD {
    int32 id    = 1;  // 活动id
    int32 index = 2;  // 从 0 开始
}
message S2C_AI_ACTIVITY_TURNTABLE_ACTIVE_REWARD {
    int32 active_value                  = 1;  // 当前活跃值
    repeated int32 active_reward_indexs = 2;  // 活跃已领奖index
}

// 钻石转盘信息
message C2S_AI_ACTIVITY_TURNTABLE_DIA_INFO {
    int32 id = 1;  // 活动id
}
message S2C_AI_ACTIVITY_TURNTABLE_DIA_INFO {
    map<int32, int32> infos                   = 1;  // k:格子index,v:剩余次数
    repeated msg_common.reward_record records = 2;  // 抽到大奖的记录
    int32 active_value                        = 3;  // 当前活跃值
    repeated int32 active_reward_indexs       = 4;  // 活跃已领奖index
}

// 钻石转盘抽奖
message C2S_AI_ACTIVITY_TURNTABLE_DIA_DRAW {
    int32 id        = 1;  // 活动id
    int32 draw_type = 2;  // 抽奖类型 1 单次 2 一键
}
message S2C_AI_ACTIVITY_TURNTABLE_DIA_DRAW {
    map<int32, int32> infos                   = 1;  // k:格子index,v:剩余次数
    int32 active_value                        = 2;  // 当前活跃值
    repeated int32 hit_indexs                 = 3;  // 所有转到的格子
    repeated msg_common.reward_record records = 4;  // 抽到大奖的记录
}

// 钻石转盘领取活跃奖励
message C2S_AI_ACTIVITY_TURNTABLE_DIA_ACTIVE_REWARD {
    int32 id    = 1;  // 活动id
    int32 index = 2;  // 从 0 开始
}
message S2C_AI_ACTIVITY_TURNTABLE_DIA_ACTIVE_REWARD {
    int32 active_value                  = 1;  // 当前活跃值
    repeated int32 active_reward_indexs = 2;  // 活跃已领奖index
}

// 战令信息
message C2S_AI_ACTIVITY_BATTLEPASS_INFO {
    int32 id = 1;  // 活动id
}
message S2C_AI_ACTIVITY_BATTLEPASS_INFO {
    int32 level                  = 2;  // 当前等级
    int32 exp                    = 3;  // 当前经验
    repeated int32 reward_levels = 4;  // 奖励已领取的等级列表
    int32 imp_reward_order_id    = 5;  // 当前领取进度orderId
    bool recharged               = 6;  // 是否购买了礼包
}

// 战令领取等级奖励
message C2S_AI_ACTIVITY_BATTLEPASS_LEVEL_REWARD {
    int32 id              = 1;  // 活动id
    repeated int32 levels = 2;  // 所有要领取的等级奖励 1个或者多个
}
message S2C_AI_ACTIVITY_BATTLEPASS_LEVEL_REWARD {
}

// 战令领取大奖
message C2S_AI_ACTIVITY_BATTLEPASS_IMP_REWARD {
    int32 id       = 1;  // 活动id
    int32 order_id = 2;  // 领取进度orderId
}
message S2C_AI_ACTIVITY_BATTLEPASS_IMP_REWARD {
}

// 战令购买经验
message C2S_AI_ACTIVITY_BATTLEPASS_BUY_EXP {
    int32 id = 1;  // 活动id
}
message S2C_AI_ACTIVITY_BATTLEPASS_BUY_EXP {
    int32 level = 1;
}

// 节日战令
// 战令信息
message C2S_AI_ACTIVITY_BATTLEPASS_TWO_INFO {
    int32 id = 1;  // 活动id
}
message S2C_AI_ACTIVITY_BATTLEPASS_TWO_INFO {
    int32 level                  = 2;  // 当前等级
    int32 exp                    = 3;  // 当前经验
    repeated int32 reward_levels = 4;  // 奖励已领取的等级列表
    int32 imp_reward_order_id    = 5;  // 当前领取进度orderId
    bool recharged               = 6;  // 是否购买了礼包
}

// 领取等级奖励
message C2S_AI_ACTIVITY_BATTLEPASS_TWO_LEVEL_REWARD {
    int32 id              = 1;  // 活动id
    repeated int32 levels = 2;  // 所有要领取的等级奖励 1个或者多个
}
message S2C_AI_ACTIVITY_BATTLEPASS_TWO_LEVEL_REWARD {
}

// 领取大奖
message C2S_AI_ACTIVITY_BATTLEPASS_TWO_IMP_REWARD {
    int32 id       = 1;  // 活动id
    int32 order_id = 2;  // 领取进度orderId
}
message S2C_AI_ACTIVITY_BATTLEPASS_TWO_IMP_REWARD {
}

// 购买战令经验
message C2S_AI_ACTIVITY_BATTLEPASS_TWO_BUY_EXP {
    int32 id = 1;  // 活动id
}
message S2C_AI_ACTIVITY_BATTLEPASS_TWO_BUY_EXP {
    int32 level = 1;
}

enum AI_ACTIVITY_FUND_TYPE {
    FUND_NONE    = 0;
    FUND_HERO    = 1;  // 英雄基金
    FUND_WARSHIP = 2;  // 战舰基金
    FUND_LOGIN   = 3;  // 登录基金
}

// 获取基金信息
message C2S_AI_ACTIVITY_FUND_INFO {
    int32 id = 1;  // 活动id
}
message S2C_AI_ACTIVITY_FUND_INFO {
    int32 id                        = 1;  // 活动id
    AI_ACTIVITY_FUND_TYPE fund_type = 2;  // 基金类型
    bool is_recharge                = 3;  // 是否充值
    int32 progress                  = 4;  // 进度
    repeated int32 free_rewards     = 5;  // 已领取免费奖励(档位index)
    repeated int32 recharge_rewards = 6;  // 已领取充值奖励(档位index)
}

// 获取基金奖励
message C2S_AI_ACTIVITY_FUND_GET_REWARD {
    int32 id    = 1;  // 活动id
    int32 index = 2;  // 档位index
}
message S2C_AI_ACTIVITY_FUND_GET_REWARD {
    repeated int32 free_rewards     = 1;  // 已领取免费奖励(档位index)
    repeated int32 recharge_rewards = 2;  // 已领取充值奖励(档位index)
}

enum AI_ACTIVITY_DAYPASS_TYPE {
    DAYPASS_NONE    = 0;
    DAYPASS_WARSHIP = 1;  // 战舰
    DAYPASS_HERO    = 2;  // 英雄
}

// 获取活动天数通行证信息
message C2S_AI_ACTIVITY_DAYPASS_INFO {
    int32 id = 1;  // 活动id
}
message S2C_AI_ACTIVITY_DAYPASS_INFO {
    int32 id                           = 1;  // 活动id
    AI_ACTIVITY_DAYPASS_TYPE pass_type = 2;  // 类型
    bool is_recharge                   = 3;  // 是否充值
    repeated int32 free_rewards        = 4;  // 已领取免费奖励(档位index)
    repeated int32 recharge_rewards    = 5;  // 已领取充值奖励(档位index)
}

// 获取活动天数通行证奖励
message C2S_AI_ACTIVITY_DAYPASS_GET_REWARD {
    int32 id    = 1;  // 活动id
    int32 index = 2;  // 档位index
}
message S2C_AI_ACTIVITY_DAYPASS_GET_REWARD {
    repeated int32 free_rewards     = 1;  // 已领取免费奖励(档位index)
    repeated int32 recharge_rewards = 2;  // 已领取充值奖励(档位index)
}

// 七日签到信息
message C2S_AI_ACTIVITY_SIGN7DAY_INFO {
    int32 id = 1;  // 活动id
}
message S2C_AI_ACTIVITY_SIGN7DAY_INFO {
    int32 max_sign_day = 1;  // 已经签到的最大天数
    bool is_today_sign = 2;  // 今日是否已经签到
}

// 七日签到/补签
message C2S_AI_ACTIVITY_SIGN7DAY_SIGN {
    int32 id             = 1;  // 活动id
    int32 last_day_index = 2;  // 前6天不用传值，第7天多选一，传下标过来，0或1
    bool is_make_up      = 3;  // 是否补签
}
message S2C_AI_ACTIVITY_SIGN7DAY_SIGN {
    int32 max_sign_day = 1;  // 已经签到的最大天数
    bool is_today_sign = 2;  // 今日是否已经签到
}

// 充值双倍信息
message C2S_AI_ACTIVITY_RECHARGE_DOUBLE_INFO {
    int32 id = 1;  // 活动id
}
message S2C_AI_ACTIVITY_RECHARGE_DOUBLE_INFO {
    int32 day_remain_times = 1;  // 每日翻倍的剩余次数
}

message AI_ACTIVITY_LUCKY_CAT_MARQUEE_INFO {
    string name = 1;  // 玩家名
    int32 rate  = 2;  // 倍率 万分比
    int32 gain  = 3;  // 得到的钻石
}

// 招财猫信息
message C2S_AI_ACTIVITY_LUCKY_CAT_INFO {
    int32 id = 1;  // 活动id
}
message S2C_AI_ACTIVITY_LUCKY_CAT_INFO {
    bool is_can_take                                     = 1;  // 是否可以领取
    int32 remain_times                                   = 2;  // 剩余转盘次数
    repeated AI_ACTIVITY_LUCKY_CAT_MARQUEE_INFO marquess = 3;  // 跑马灯信息
    int32 cost_diamonds                                  = 4;  // 需投入的钻石数
    int32 progress                                       = 5;  // 当前进度
    int32 progress_max                                   = 6;  // 进度上限
    int32 day_max_times                                  = 7;  // 每日最大次数
    bool is_day_take_limit                               = 8;  // 是否达到每日最大次数
}

// 招财猫领取次数
message C2S_AI_ACTIVITY_LUCKY_CAT_TAKE {
    int32 id = 1;  // 活动id
}
message S2C_AI_ACTIVITY_LUCKY_CAT_TAKE {
    int32 remain_times     = 1;  // 剩余转盘次数
    bool is_day_take_limit = 2;  // 是否达到每日最大次数
}

// 招财猫转盘抽奖
message C2S_AI_ACTIVITY_LUCKY_CAT_TURNTABLE_ROLL {
    int32 id = 1;  // 活动id
}
message S2C_AI_ACTIVITY_LUCKY_CAT_TURNTABLE_ROLL {
    int32 hit_index                                      = 1;  // 抽中转盘index[0-6]
    int32 remain_times                                   = 2;  // 剩余转盘次数
    int32 cost_diamonds                                  = 3;  // 下次需投入的钻石数
    int32 reward_diamonds                                = 4;  // 奖励钻石数
    repeated AI_ACTIVITY_LUCKY_CAT_MARQUEE_INFO marquess = 5;  // 跑马灯信息
}

// 跨服特惠礼包，跨服限购礼包
message C2S_AI_ACTIVITY_LIMIT_GIFT_CROSS_INFO {
    int32 id = 1;  // 活动id
}
message S2C_AI_ACTIVITY_LIMIT_GIFT_CROSS_INFO {
    bool day_free_reward_status = 1;  // 是否领取每日免费奖励
    map<int32, int32> buy_times = 2;  // 已经购买次数，key:index,value:次数
}

// 跨服特惠礼包，跨服限购礼包领取每日免费奖励
message C2S_AI_ACTIVITY_LIMIT_GIFT_CROSS_TAKE_FREE_REWARD {
    int32 id = 1;  // 活动id
}
message S2C_AI_ACTIVITY_LIMIT_GIFT_CROSS_TAKE_FREE_REWARD {
}

message ai_activity_rank_cross {
    ai_activity_base base_info                                    = 1;   // 排行榜基础配置信息
    repeated msg_common.ai_activity_rank_info ranks               = 3;   // 个人排行榜列表
    int64 mine_score                                              = 4;   // 我的得分
    int32 mine_rank                                               = 5;   // 我的排名
    bool gift_taked                                               = 6;   // 奖励是否已领取
    int64 init_score                                              = 7;   // 初始得分
    repeated msg_common.ai_activity_rank_server_info server_ranks = 8;   // 区服排行榜列表
    int64 server_mine_score                                       = 9;   // 我的区服得分
    int32 server_mine_rank                                        = 10;  // 我的区服排名
    bool server_gift_taked                                        = 11;  // 我的区服奖励是否已领取
}

// 跨服冲榜获取信息
message C2S_AI_ACTIVITY_RANK_CROSS_GET_INFO {
    int32 id = 1;  // 活动id
}

message S2C_AI_ACTIVITY_RANK_CROSS_GET_INFO {
    ai_activity_rank_cross ai_activity_rank_cross_info = 1;  // 冲榜信息
}

// 跨服冲榜领取奖励
message C2S_AI_ACTIVITY_RANK_CROSS_TAKE_REWARD {
    int32 id       = 1;  // 活动id
    bool is_server = 2;  // 是否区服
}

message S2C_AI_ACTIVITY_RANK_CROSS_TAKE_REWARD {
    int32 id                                         = 1;  // 活动id
    enum_const.AI_ACTIVITY_RANK_CROSS_TYPE rank_type = 2;  // 冲榜类型
    bool gift_taked                                  = 3;  // 奖励是否已领取
    bool is_server                                   = 4;  // 是否区服
}

message ai_activity_rank_guild {
    ai_activity_base base_info                                  = 1;  // 排行榜基础配置信息
    repeated msg_common.ai_activity_rank_guild_info ranks = 2;  // 公会排行榜列表
    int64 mine_score                                      = 3;  // 我的公会得分
    int32 mine_rank                                       = 4;  // 我的公会排名
    bool gift_taked                                       = 5;  // 我的公会奖励是否已领取
    int64 init_score                                      = 6;  // 我的公会初始得分
}

// 公会冲榜获取信息
message C2S_AI_ACTIVITY_RANK_GUILD_GET_INFO {
    int32 id = 1;  // 活动id
}

message S2C_AI_ACTIVITY_RANK_GUILD_GET_INFO {
    ai_activity_rank_guild ai_activity_rank_guild_info = 1;  // 公会冲榜信息
}

// 公会冲榜领取奖励
message C2S_AI_ACTIVITY_RANK_GUILD_TAKE_REWARD {
    int32 id = 1;  // 活动id
}

message S2C_AI_ACTIVITY_RANK_GUILD_TAKE_REWARD {
    int32 id                                         = 1;  // 活动id
    enum_const.AI_ACTIVITY_RANK_GUILD_TYPE rank_type = 2;  // 冲榜类型
    bool gift_taked                                  = 3;  // 奖励是否已领取
}


// 获取充值御守奖励
message C2S_AI_ACTIVITY_AMULET_RECHARGE_INFO {
  int32 id = 1;
}
message S2C_AI_ACTIVITY_AMULET_RECHARGE_INFO {
  int32 can_reward_num = 1;  // 可领取御守数量
