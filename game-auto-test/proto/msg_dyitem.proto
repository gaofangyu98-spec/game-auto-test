syntax = "proto3";
package msg_dyitem;

message dynamic_item {
  int64 id = 1;
  string v = 2;
}

message C2S_DYITEM_LIST {}

message S2C_DYITEM_LIST {
  // items: unknown field number
}

message C2S_DYITEM_UPDATE {
