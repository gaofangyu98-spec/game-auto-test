syntax = "proto3";
package msg_sync;

message S2C_ERROR {
  int64 code = 1;
  int64 pid = 2;
}

message S2C_CONNECTED {}

message S2C_CLOSE {
  int64 code = 1;
}

message C2S_ENTER_GAME {}

message S2C_ENTER_GAME {}

message S2C_RESET_NOTIFY {
  int64 resetType = 1;
}

message S2C_RECHARGE_NOTIFY {
  int64 rechargeId = 1;
}

message HORN_CONTENT {
  string lan = 1;
  string content = 2;
}

message S2C_CONFIG_CHANGE_NOTIFY {}
