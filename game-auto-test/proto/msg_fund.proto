syntax = "proto3";
package msg_fund;

message C2S_ROLE_FUND_INFO {
  int64 fundType = 1;
}

message S2C_ROLE_FUND_INFO {
  // fundData: unknown field number
  int64 closeTime = 2;
  int64 buy = 3;
}

message FundData {
  int64 id = 1;
  int64 progress = 2;
  int64 status = 3;
}

message C2S_GET_FUND_REWARD {
  int64 fundType = 1;
  int64 id = 2;
}

message S2C_GET_FUND_REWARD {
  int64 id = 1;
  int64 status = 2;
  int64 closeTime = 3;
}

message C2S_GET_ALL_FUND_REWARD {
  int64 fundType = 1;
}

message S2C_GET_ALL_FUND_REWARD {
  // ids: unknown field number
  int64 closeTime = 2;
}
