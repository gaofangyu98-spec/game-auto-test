message ai_activity_rank_info {
    int64 v                           = 1;  // 排行榜分数
    msg_common.RANKING_INFO_ROLE role = 2;  // 玩家信息
}

message ai_activity_rank_server_info {
    int64 v                               = 1;  // 排行榜分数
    msg_common.RANKING_INFO_SERVER server = 2;  // 区服信息
}

message ai_activity_rank_guild_info {
    int64 v                                   = 1;  // 排行榜分数
    msg_common.RANKING_INFO_GUILD guild       = 2;  // 公会信息
    msg_common.RANKING_INFO_ROLE role = 3;  // 公会会长信息
}

// 奖励记录
message reward_record {
    string name    = 1;  // 玩家名字
    int32 item_id  = 2;  // 道具id
    int32 item_num = 3;  // 道具数量
}

message common_kv {
    int32 key   = 1;  // 键
    int64 value = 2;  // 值
}

message common_kvs {
    repeated common_kv list = 1;  // 列表
}

message guild_simple_info {
    int32 guild_id    = 1;  // 公会id
    int32 guild_lv    = 2;  // 公会等级
    string guild_name = 3;  // 公会名字
    int32 guild_icon  = 4;  // 公会头像
    int32 master_rid  = 5;  // 公会会长id
    int32 server_id   = 6;  // 服务器id
}

message common_repeated_int32 {
    repeated int32 list = 1;
}

message common_map_int32_repeated_int32 {
    map<int32,common_repeated_int32> list = 1;
}

