name: CI

# 触发条件：push 或 PR 到 main/master 分支
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 第1步：拉取代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 第2步：设置 Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 第3步：安装依赖（代码在 game-auto-test/ 子目录下）
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r game-auto-test/requirements.txt

      # 第4步：语法检查（不连服务器）
      - name: Syntax check
        run: |
          python -m py_compile game-auto-test/api/*.py game-auto-test/client/*.py game-auto-test/config/*.py game-auto-test/tests/*.py

      # 第5步：只收集用例不执行（验证导入，不连服务器）
      - name: Collect tests
        run: |
          cd game-auto-test && pytest --collect-only -q
