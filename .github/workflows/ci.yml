name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax check
        run: |
          python -m py_compile api/*.py client/*.py config/*.py tests/*.py

      - name: Collect tests
        run: |
          pytest --collect-only -q

      # 成功通知：上面所有步骤都通过了才会跑这步
      - name: Feishu notify success
        if: success()
        run: |
          curl -X POST ${{ secrets.FEISHU_WEBHOOK }} \
            -H "Content-Type: application/json" \
            -d '{
              "msg_type": "text",
              "content": {
                "text": "✅ CI 构建成功\n项目：游戏自动化测试\n分支：${{ github.ref_name }}\n提交人：${{ shturl.cc/E8 }}\n耗时：${{ job.status }}"
              }
            }'

      # 失败通知：任意一步失败就会跑这步
      - name: Feishu notify failure
        if: failure()
        run: |
          curl -X POST ${{ secrets.FEISHU_WEBHOOK }} \
            -H "Content-Type: application/json" \
            -d '{
              "msg_type": "text",
              "content": {
                "text": "❌ CI 构建失败\n项目：游戏自动化测试\n分支：${{ github.ref_name }}\n提交人：${{ shturl.cc/E8 }}\n快去修！"
              }
            }'
